version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finpilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finpilot_password}
      POSTGRES_DB: ${POSTGRES_DB:-finpilot_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - finpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finpilot} -d ${POSTGRES_DB:-finpilot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  finpilot_pgdata:
    driver: local
